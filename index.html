<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#090d16">
  <title>Hall Pass</title>
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: #0f172a;
      --border: #1e293b;
      --border-focus: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --btn-base: #1e293b;
      --c-bath: #38bdf8;
      --c-hall: #818cf8;
      --c-misc: #c084fc;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: env(safe-area-inset-top, 20px) env(safe-area-inset-right, 20px) env(safe-area-inset-bottom, 20px) env(safe-area-inset-left, 20px);
      overflow-x: hidden;
    }

    .kiosk-frame {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 28px;
      padding: 34px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    .lockdown-indicator {
      display: none;
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1.5px solid #10b981;
      color: #34d399;
      padding: 6px 18px;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      z-index: 100;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }

    .header-tag {
      font-size: 0.85rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .header-title {
      font-size: 2.1rem;
      font-weight: 800;
      margin: 0 0 6px 0;
      color: var(--text);
    }

    .header-subtitle {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin: 0 0 24px 0;
    }

    .kiosk-btn {
      width: 100%;
      background: var(--btn-base);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 20px 24px;
      margin-bottom: 14px;
      text-align: left;
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .kiosk-btn:active {
      transform: scale(0.985);
    }
    .kiosk-btn h2 {
      margin: 0;
      font-size: 1.45rem;
      color: var(--text);
    }
    .kiosk-btn p {
      margin: 0;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .btn-bath { border-color: var(--c-bath); }
    .btn-bath:active { background: rgba(56, 189, 248, 0.1); }
    .btn-hall { border-color: var(--c-hall); }
    .btn-hall:active { background: rgba(129, 140, 248, 0.1); }
    .btn-misc { border-color: var(--c-misc); }
    .btn-misc:active { background: rgba(192, 132, 252, 0.1); }

    .period-grid {
      display: grid;
      gap: 12px;
      margin-bottom: 16px;
      max-height: 440px;
      overflow-y: auto;
      padding-right: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .period-btn {
      background: var(--btn-base);
      border: 1.5px solid var(--border-focus);
      border-radius: 14px;
      padding: 16px 20px;
      text-align: center;
      cursor: pointer;
    }
    .period-btn:active {
      transform: scale(0.985);
      background: rgba(56, 189, 248, 0.15);
    }
    .period-btn h3 {
      margin: 0;
      font-size: 1.25rem;
      color: var(--text);
    }
    .period-btn p {
      margin: 4px 0 0 0;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .search-input {
      width: 100%;
      background: var(--bg);
      border: 1.5px solid var(--border-focus);
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      color: #fff;
      outline: none;
      margin-bottom: 14px;
      user-select: text;
      -webkit-user-select: text;
    }

    .student-list {
      max-height: 360px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .student-item {
      background: var(--btn-base);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .student-item:active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--border-focus);
    }

    .active-pass-card {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 18px 20px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .pass-info h3 {
      margin: 0 0 4px 0;
      font-size: 1.35rem;
      color: #fff;
    }
    .pass-info p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .pass-timer-box {
      text-align: right;
      min-width: 120px;
    }
    .pass-clock {
      font-size: 2.2rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      margin: 2px 0;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .badge-ontime { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    .badge-grace { background: rgba(245, 158, 11, 0.2); color: #fde047; border: 1px solid #f59e0b; }
    .badge-overdue { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

    .btn-card-return {
      background: var(--success);
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn-card-return:active {
      transform: scale(0.97);
      background: #16a34a;
    }

    .btn-add-pass {
      width: 100%;
      background: rgba(56, 189, 248, 0.1);
      border: 1.5px dashed var(--c-bath);
      color: var(--c-bath);
      border-radius: 18px;
      padding: 16px;
      font-size: 1.15rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-add-pass:active {
      background: rgba(56, 189, 248, 0.2);
      transform: scale(0.985);
    }

    .btn-nav {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-nav:active {
      color: var(--text);
      border-color: #64748b;
    }

    .btn-teal {
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-teal:active { background: #0369a1; }

    .btn-lockdown-hero {
      width: 100%;
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      color: #ffffff;
      border: 2px solid #34d399;
      border-radius: 18px;
      padding: 18px 24px;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.45);
      margin-bottom: 20px;
    }

    .admin-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .admin-card h3 {
      margin: 0 0 6px 0;
      font-size: 1.1rem;
      color: var(--c-bath);
    }
    .admin-card p {
      margin: 0 0 10px 0;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    textarea.admin-input {
      width: 100%;
      height: 90px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      font-family: monospace;
      outline: none;
      resize: vertical;
      user-select: text;
      -webkit-user-select: text;
    }

    .period-edit-row {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .log-table-wrap {
      max-height: 280px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-top: 10px;
      -webkit-overflow-scrolling: touch;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: left; }
    th { background: #1e293b; padding: 10px 12px; color: var(--text); font-weight: 700; position: sticky; top: 0; }
    td { padding: 9px 12px; border-bottom: 1px solid var(--border); }

    .tamper-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(9, 13, 22, 0.95);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
  </style>
</head>
<body>

<div id="lockdownIndicator" class="lockdown-indicator">🔒 Locked Kiosk Mode Active</div>

<div class="kiosk-frame" id="app"></div>

<!-- Universal In-App PIN Prompt Modal -->
<div id="pinModal" class="tamper-overlay">
  <div class="kiosk-frame" style="max-width: 440px; text-align: center;">
    <div id="pinModalIcon" style="font-size: 2.8rem; margin-bottom: 6px;">🔐</div>
    <h2 id="pinModalTitle" style="margin: 0 0 6px 0; font-size: 1.5rem; color: #fff;">Teacher PIN Required</h2>
    <p id="pinModalMsg" style="color: var(--text-muted); margin: 0 0 16px 0; font-size: 0.9rem;">
      Enter your teacher PIN to exit Kiosk Lockdown mode.
    </p>
    
    <input type="password" id="modalPinField" class="search-input" style="max-width: 220px; text-align: center; font-size: 24px; letter-spacing: 6px; margin: 0 auto 14px auto;" placeholder="••••" maxlength="8" onkeydown="handleModalPinKey(event)">
    
    <div style="display: flex; gap: 10px; justify-content: center;">
      <button class="btn-nav" onclick="closePinModal()">Cancel</button>
      <button class="btn-teal" id="modalSubmitBtn" onclick="confirmModalPin()">Authorize</button>
    </div>
  </div>
</div>

<script>
  const DEFAULT_ROSTER = {
    "1": { course: "College Math", students: ["Alex Rivera", "David Chen", "Emma Watson", "Lucas Miller", "Sarah Jenkins"] },
    "2": { course: "Calculus", students: ["Brandon Scott", "Chloe Adams", "Daniel Ortiz", "Jessica Taylor", "Noah Kim"] },
    "3": { course: "College Math", students: ["Aiden Clark", "Emily Zhang", "James Wilson", "Mia Patel", "Sophia Rossi"] },
    "4": { course: "Calculus", students: ["Andrew Bell", "Grace Morales", "Jack Murphy", "Liam Nelson", "Olivia Diaz"] },
    "5": { course: "College Math", students: ["Benjamin Lee", "Ella Flores", "Hannah Brooks", "Logan Wright", "Mason Hall"] },
    "6": { course: "Pre-Calculus", students: ["Ethan Wright", "Isabella King", "Mason Scott", "Oliver Evans", "Samantha Reed"] },
    "7": { course: "Calculus Lab", students: ["Caleb Young", "Harper Wood", "Jackson White", "Kayla Hall", "Zoe Baker"] }
  };

  let store = {
    pin: localStorage.getItem("hp_pin") || "1234",
    webhookUrl: localStorage.getItem("hp_webhook") || "",
    rosters: JSON.parse(localStorage.getItem("hp_rosters")) || DEFAULT_ROSTER,
    logs: JSON.parse(localStorage.getItem("hp_logs")) || [],
    maxConcurrent: parseInt(localStorage.getItem("hp_max_passes")) || 2,
    baseSeconds: 300,
    graceSeconds: 390,
    isLockdownActive: false
  };

  let activePasses = [];

  let currentDraft = {
    view: "HOME",
    reasonEn: "",
    reasonEs: "",
    period: "1",
    course: ""
  };

  let globalTimerInterval = null;
  const app = document.getElementById("app");

  function saveStore() {
    localStorage.setItem("hp_pin", store.pin);
    localStorage.setItem("hp_webhook", store.webhookUrl);
    localStorage.setItem("hp_rosters", JSON.stringify(store.rosters));
    localStorage.setItem("hp_logs", JSON.stringify(store.logs));
    localStorage.setItem("hp_max_passes", store.maxConcurrent);
  }

  function getSortedPeriodKeys() {
    return Object.keys(store.rosters).sort((a, b) => {
      const numA = parseInt(a, 10);
      const numB = parseInt(b, 10);
      if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
      return a.localeCompare(b);
    });
  }

  function startEngine() {
    if (globalTimerInterval) clearInterval(globalTimerInterval);
    globalTimerInterval = setInterval(() => {
      if (activePasses.length > 0) {
        updateAllPassClocks();
      }
    }, 1000);
  }

  function updateAllPassClocks() {
    const now = Date.now();
    activePasses.forEach(pass => {
      const clockEl = document.getElementById(`clock_${pass.id}`);
      const badgeEl = document.getElementById(`badge_${pass.id}`);
      if (!clockEl) return;

      const elapsed = Math.floor((now - pass.departTime.getTime()) / 1000);
      const remaining = store.baseSeconds - elapsed;

      if (remaining >= 0) {
        const m = Math.floor(remaining / 60);
        const s = remaining % 60;
        clockEl.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        clockEl.style.color = "var(--text)";
        if (badgeEl) {
          badgeEl.className = "status-badge badge-ontime";
          badgeEl.innerText = "ON TIME";
        }
      } else if (elapsed <= store.graceSeconds) {
        const graceElapsed = elapsed - store.baseSeconds;
        const m = Math.floor(graceElapsed / 60);
        const s = graceElapsed % 60;
        clockEl.innerText = `+${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        clockEl.style.color = "var(--warning)";
        if (badgeEl) {
          badgeEl.className = "status-badge badge-grace";
          badgeEl.innerText = "GRACE PERIOD";
        }
      } else {
        const overdue = elapsed - store.graceSeconds;
        const m = Math.floor(overdue / 60);
        const s = overdue % 60;
        clockEl.innerText = `-${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        clockEl.style.color = "var(--danger)";
        if (badgeEl) {
          badgeEl.className = "status-badge badge-overdue";
          badgeEl.innerText = "OVERDUE";
        }
      }
    });
  }

  /* --- LOCKDOWN & TAMPER SYSTEM --- */
  let pendingModalAction = null;

  function enterLockdownMode() {
    store.isLockdownActive = true;
    document.getElementById("lockdownIndicator").style.display = "block";

    const elem = document.documentElement;
    if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
    else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();

    currentDraft.view = activePasses.length > 0 ? "HOME" : "REASON";
    render();
  }

  function requestUnlockKiosk() {
    pendingModalAction = "UNLOCK_KIOSK";
    document.getElementById("pinModalIcon").innerText = "🔓";
    document.getElementById("pinModalTitle").innerText = "Exit Kiosk Lockdown";
    document.getElementById("pinModalMsg").innerText = "Enter Teacher PIN to unlock the screen.";
    document.getElementById("modalPinField").value = "";
    document.getElementById("pinModal").style.display = "flex";
    setTimeout(() => document.getElementById("modalPinField").focus(), 100);
  }

  function triggerTamperAlert(reason) {
    pendingModalAction = "TAMPER_RECOVERY";
    document.getElementById("pinModalIcon").innerText = "🚨";
    document.getElementById("pinModalTitle").innerText = "Security Alert";
    document.getElementById("pinModalMsg").innerText = `${reason} Enter Teacher PIN to restore.`;
    document.getElementById("modalPinField").value = "";
    document.getElementById("pinModal").style.display = "flex";
    setTimeout(() => document.getElementById("modalPinField").focus(), 100);

    store.logs.push({
      timestamp: new Date().toLocaleDateString() + " " + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      period: "ALERT",
      course: "Security",
      studentName: "Tamper Violation",
      reason: reason,
      duration: "0 min",
      status: "FLAGGED"
    });
    saveStore();

    if (store.webhookUrl) {
      fetch(store.webhookUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "TAMPER_ALERT", detail: reason })
      }).catch(() => {});
    }
  }

  function confirmModalPin() {
    const val = document.getElementById("modalPinField").value.trim();
    if (val === store.pin) {
      document.getElementById("pinModal").style.display = "none";
      if (pendingModalAction === "UNLOCK_KIOSK") {
        store.isLockdownActive = false;
        document.getElementById("lockdownIndicator").style.display = "none";
        if (document.exitFullscreen && document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        }
        render();
      } else if (pendingModalAction === "TAMPER_RECOVERY") {
        const elem = document.documentElement;
        if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
      }
    } else {
      alert("Incorrect Teacher PIN.");
    }
  }

  function closePinModal() {
    if (pendingModalAction === "TAMPER_RECOVERY") return;
    document.getElementById("pinModal").style.display = "none";
  }

  function handleModalPinKey(e) {
    if (e.key === "Enter") confirmModalPin();
  }

  window.addEventListener("keydown", (e) => {
    if (!store.isLockdownActive) return;
    if (e.key === "Escape" || e.key === "F11" || (e.altKey && e.key === "Tab") || (e.metaKey && e.key === "w") || (e.ctrlKey && e.key === "t")) {
      e.preventDefault();
      triggerTamperAlert("Attempted exit shortcut (" + e.key + ").");
    }
  }, true);

  document.addEventListener("visibilitychange", () => {
    if (store.isLockdownActive && document.hidden) {
      triggerTamperAlert("Tab or browser window lost focus.");
    }
  });

  document.addEventListener("fullscreenchange", () => {
    if (store.isLockdownActive && !document.fullscreenElement) {
      triggerTamperAlert("Fullscreen kiosk mode was interrupted.");
    }
  });

  function render() {
    if (currentDraft.view === "HOME" || (currentDraft.view === "TIMER" && activePasses.length > 0)) {
      renderActivePassesDashboard();
      return;
    }

    if (currentDraft.view === "REASON") {
      app.innerHTML = `
        <div class="header-tag">Screen 1 • Paso 1</div>
        <h1 class="header-title">Select Reason / Razón</h1>
        <p class="header-subtitle">Tap why you are leaving / Seleccione el motivo</p>

        <div class="kiosk-btn btn-bath" onclick="chooseReason('Bathroom', 'Baño')">
          <h2>Bathroom</h2>
          <p>Baño / Sanitarios</p>
        </div>

        <div class="kiosk-btn btn-hall" onclick="chooseReason('Hallway', 'Pasillo')">
          <h2>Hallway</h2>
          <p>Pasillo (Agua, Casillero, Enfermería)</p>
        </div>

        <div class="kiosk-btn btn-misc" onclick="chooseReason('Miscellaneous', 'Varios')">
          <h2>Miscellaneous</h2>
          <p>Varios / Otra Razón</p>
        </div>

        <div style="margin-top: 26px; display: flex; justify-content: space-between; align-items: center;">
          ${activePasses.length > 0 ? `<button class="btn-nav" onclick="navigate('HOME')">← Active Passes (${activePasses.length})</button>` : `<button class="btn-nav" onclick="navigate('TEACHER_LOCK')">⚙️ Teacher area / Área del Maestro</button>`}
          ${store.isLockdownActive ? `<button class="btn-nav" style="color: #34d399; border-color: #059669;" onclick="requestUnlockKiosk()">🔓 Exit Kiosk</button>` : ""}
        </div>
      `;
    } 
    else if (currentDraft.view === "PERIOD") {
      const pKeys = getSortedPeriodKeys();
      app.innerHTML = `
        <div class="header-tag">Screen 2 • Paso 2</div>
        <h1 class="header-title">Select Period / Período</h1>
        <p class="header-subtitle">${currentDraft.reasonEn} (${currentDraft.reasonEs})</p>

        <div class="period-grid">
          ${pKeys.map(p => `
            <div class="period-btn" onclick="choosePeriod('${p}')">
              <h3>Period ${p} / Período ${p}</h3>
              <p>${store.rosters[p]?.course || "Open Roster"} (${(store.rosters[p]?.students || []).length} students)</p>
            </div>
          `).join("")}
        </div>

        <button class="btn-nav" onclick="navigate('${activePasses.length > 0 ? "HOME" : "REASON"}')">← Back / Regresar</button>
      `;
    } 
    else if (currentDraft.view === "STUDENT") {
      const roster = store.rosters[currentDraft.period]?.students || [];
      app.innerHTML = `
        <div class="header-tag">Screen 3 • Paso 3</div>
        <h1 class="header-title">Select Name / Nombre</h1>
        <p class="header-subtitle">Period ${currentDraft.period} • ${currentDraft.course}</p>

        <input type="text" class="search-input" id="searchBox" placeholder="🔍 Search name / Buscar nombre..." oninput="filterStudents()" autofocus>

        <div class="student-list" id="studentContainer">
          ${renderStudentList(roster)}
        </div>

        <div style="margin-top: 16px;">
          <button class="btn-nav" onclick="navigate('PERIOD')">← Back / Regresar</button>
        </div>
      `;
    } 
    else if (currentDraft.view === "TEACHER_LOCK") {
      app.innerHTML = `
        <button class="btn-nav" onclick="navigate('${activePasses.length > 0 ? "HOME" : "REASON"}')">← Back to Kiosk</button>
        <h1 class="header-title" style="margin-top: 16px;">Teacher Area Security</h1>
        <p class="header-subtitle">Enter PIN to access configuration & audit logs</p>

        <div class="admin-card" style="text-align: center; padding: 24px;">
          <input type="password" id="pinField" class="search-input" style="max-width: 220px; text-align: center; font-size: 24px; letter-spacing: 6px;" placeholder="••••" maxlength="8" onkeydown="handleTeacherPinKey(event)">
          <div>
            <button class="btn-teal" style="font-size: 1.1rem; padding: 12px 32px;" onclick="checkPin()">Open Portal</button>
          </div>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 14px;">Press Return on Mac or click Open Portal.</p>
        </div>
      `;
      setTimeout(() => {
        const f = document.getElementById("pinField");
        if (f) f.focus();
      }, 50);
    } 
    else if (currentDraft.view === "TEACHER_PORTAL") {
      renderTeacherPortal();
    }
  }

  function renderActivePassesDashboard() {
    const isLimitReached = activePasses.length >= store.maxConcurrent;

    app.innerHTML = `
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <span class="header-tag" style="margin: 0;">Active Passes • Salidas Activas (${activePasses.length} / ${store.maxConcurrent})</span>
        ${store.isLockdownActive ? `<button class="btn-nav" style="color: #34d399; border-color: #059669; padding: 6px 12px; font-size: 0.8rem;" onclick="requestUnlockKiosk()">🔓 Exit Kiosk</button>` : `<button class="btn-nav" style="padding: 6px 12px; font-size: 0.8rem;" onclick="navigate('TEACHER_LOCK')">⚙️ Teacher area</button>`}
      </div>

      <div id="activePassesContainer">
        ${activePasses.map(p => `
          <div class="active-pass-card" id="card_${p.id}">
            <div class="pass-info">
              <span id="badge_${p.id}" class="status-badge badge-ontime">ON TIME</span>
              <h3>${p.studentName}</h3>
              <p style="color: var(--c-bath); font-weight: 700;">${p.reasonEn} / ${p.reasonEs}</p>
              <p style="font-size: 0.82rem; margin-top: 2px;">Period ${p.period} • ${p.course}</p>
            </div>
            <div class="pass-timer-box">
              <div class="pass-clock" id="clock_${p.id}">05:00</div>
              <button class="btn-card-return" onclick="handleStudentReturn('${p.id}')">
                I'M BACK<br><span style="font-size: 0.75rem;">YA REGRESÉ</span>
              </button>
            </div>
          </div>
        `).join("")}
      </div>

      ${isLimitReached ? `
        <div style="background: rgba(239, 68, 68, 0.1); border: 1.5px solid var(--danger); border-radius: 16px; padding: 14px; text-align: center; color: #f87171; font-weight: 700; margin-top: 12px; font-size: 0.95rem;">
          🚫 Classroom Pass Limit Reached (${store.maxConcurrent} Out)<br>
          <span style="font-size: 0.82rem; color: #fca5a5; font-weight: 400;">A student must return before another can check out.</span>
        </div>
      ` : `
        <button class="btn-add-pass" onclick="navigate('REASON')">
          <span style="font-size: 1.35rem;">+</span>
          <span>Issue Another Hall Pass / Salida Adicional</span>
        </button>
      `}
    `;
    updateAllPassClocks();
  }

  function handleTeacherPinKey(e) {
    if (e.key === "Enter") {
      checkPin();
    }
  }

  function chooseReason(en, es) {
    currentDraft.reasonEn = en;
    currentDraft.reasonEs = es;
    currentDraft.view = "PERIOD";
    render();
  }

  function choosePeriod(p) {
    currentDraft.period = p;
    currentDraft.course = store.rosters[p]?.course || "Math";
    currentDraft.view = "STUDENT";
    render();
  }

  function renderStudentList(list) {
    if (!list || list.length === 0) {
      return `<p style="color: var(--text-muted); padding: 10px;">No students enrolled for this period.</p>`;
    }
    return list.map(name => `
      <div class="student-item" onclick="startStudentPass('${name.replace(/'/g, "\\'")}')">
        <span>${name}</span>
        <span style="color: var(--c-bath); font-size: 0.9rem;">Start →</span>
      </div>
    `).join("");
  }

  function filterStudents() {
    const q = document.getElementById("searchBox").value.toLowerCase();
    const all = store.rosters[currentDraft.period]?.students || [];
    const filtered = all.filter(s => s.toLowerCase().includes(q));
    document.getElementById("studentContainer").innerHTML = renderStudentList(filtered);
  }

  function startStudentPass(student) {
    if (activePasses.some(p => p.studentName === student)) {
      alert(`${student} is already out on an active hall pass.`);
      return;
    }

    const newPass = {
      id: "pass_" + Date.now() + "_" + Math.floor(Math.random() * 1000),
      studentName: student,
      reasonEn: currentDraft.reasonEn,
      reasonEs: currentDraft.reasonEs,
      period: currentDraft.period,
      course: currentDraft.course,
      departTime: new Date()
    };

    activePasses.push(newPass);

    if (store.webhookUrl) {
      const exp = new Date(newPass.departTime.getTime() + store.baseSeconds * 1000);
      fetch(store.webhookUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "DEPART",
          date: newPass.departTime.toLocaleDateString(),
          period: newPass.period,
          course: newPass.course,
          studentName: newPass.studentName,
          reason: newPass.reasonEn,
          departTime: newPass.departTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
          expectedReturn: exp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
        })
      }).catch(() => {});
    }

    currentDraft.view = "HOME";
    render();
  }

  function handleStudentReturn(passId) {
    const index = activePasses.findIndex(p => p.id === passId);
    if (index === -1) return;

    const pass = activePasses[index];
    const returnTime = new Date();
    const elapsedSecs = Math.floor((returnTime - pass.departTime) / 1000);
    const durationMins = (elapsedSecs / 60).toFixed(2);

    let status = "On Time";
    if (elapsedSecs > store.graceSeconds) status = "Overdue";
    else if (elapsedSecs > store.baseSeconds) status = "Within Grace";

    store.logs.push({
      timestamp: pass.departTime.toLocaleDateString() + " " + pass.departTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      period: pass.period,
      course: pass.course,
      studentName: pass.studentName,
      reason: pass.reasonEn,
      duration: durationMins + " min",
      status: status
    });
    saveStore();

    if (store.webhookUrl) {
      fetch(store.webhookUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "RETURN",
          studentName: pass.studentName,
          actualReturnTime: returnTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
          totalMinutesOut: durationMins,
          finalStatus: status
        })
      }).catch(() => {});
    }

    activePasses.splice(index, 1);

    if (activePasses.length === 0) {
      currentDraft.view = "REASON";
    } else {
      currentDraft.view = "HOME";
    }
    render();
  }

  function checkPin() {
    const val = document.getElementById("pinField").value.trim();
    if (val === store.pin) {
      currentDraft.view = "TEACHER_PORTAL";
      render();
    } else {
      alert("Incorrect Teacher PIN. Please try again.");
    }
  }

  function renderTeacherPortal() {
    const pKeys = getSortedPeriodKeys();

    app.innerHTML = `
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1 class="header-title" style="font-size: 1.5rem; margin: 0;">Teacher Area</h1>
        <button class="btn-nav" onclick="navigate('${activePasses.length > 0 ? "HOME" : "REASON"}')">Exit to Kiosk</button>
      </div>

      <button class="btn-lockdown-hero" onclick="enterLockdownMode()">
        <span style="font-size: 1.5rem;">🔒</span>
        <span>LAUNCH KIOSK LOCKDOWN MODE</span>
      </button>

      <div class="admin-card">
        <h3>1. Multi-Student Pass Limit</h3>
        <p>Control the maximum number of students allowed out at the same time:</p>
        <div style="display: flex; align-items: center; gap: 12px;">
          <input type="number" id="maxPassesInput" class="search-input" style="max-width: 120px; font-size: 18px; margin: 0;" min="1" max="10" value="${store.maxConcurrent}">
          <button class="btn-teal" onclick="saveMaxPasses()">Save Limit</button>
        </div>
      </div>

      <div class="admin-card">
        <h3>2. Google Sheets Webhook URL (Dual Sync)</h3>
        <p>Paste your deployed Apps Script Web App URL below:</p>
        <input type="text" id="webhookInput" class="search-input" style="font-size: 14px; margin-bottom: 8px;" placeholder="https://script.google.com/macros/s/.../exec" value="${store.webhookUrl}">
        
        <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px;">
          <button class="btn-teal" onclick="saveWebhook()">Save URL</button>
          <button class="btn-teal" style="background: #059669;" id="testPingBtn" onclick="testWebhookConnection()">Test Connection</button>
        </div>
        <div id="testPingStatus" style="font-size: 0.85rem; font-weight: 700; margin-top: 6px;"></div>
      </div>

      <div class="admin-card">
        <h3 style="margin: 0;">3. Class Periods & Rosters (${pKeys.length} Active Periods)</h3>
        <p style="margin: 4px 0 12px 0;">Add periods, edit subject names, delete unused ones, or modify rosters:</p>

        <div style="background: #090d16; border: 1px dashed var(--border-focus); border-radius: 12px; padding: 12px; margin-bottom: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
          <input type="text" id="newPeriodKey" class="search-input" style="max-width: 130px; margin: 0; padding: 10px 12px; font-size: 14px;" placeholder="Period # (e.g. 8)">
          <input type="text" id="newPeriodCourse" class="search-input" style="flex: 1; min-width: 160px; margin: 0; padding: 10px 12px; font-size: 14px;" placeholder="Course Name (e.g. Advisory)">
          <button class="btn-teal" style="background: var(--c-bath); color: #000;" onclick="addNewPeriod()">+ Add Period</button>
        </div>

        <div id="periodRowsContainer">
          ${pKeys.map(p => `
            <div class="period-edit-row">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span style="font-weight: 800; color: var(--c-bath); font-size: 1.05rem;">Period ${p}</span>
                <button class="btn-nav" style="color: var(--danger); border-color: rgba(239, 68, 68, 0.4); padding: 4px 10px; font-size: 0.8rem;" onclick="deletePeriod('${p}')">✕ Remove Period ${p}</button>
              </div>

              <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 4px;">Subject / Course Title:</label>
              <input type="text" id="c_name_${p}" class="search-input" style="padding: 10px 12px; margin-bottom: 8px; font-size: 14px;" value="${store.rosters[p]?.course || ""}">

              <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 4px;">Student Names (one per line):</label>
              <textarea id="roster_txt_${p}" class="admin-input" style="height: 75px;">${(store.rosters[p]?.students || []).join("\n")}</textarea>
            </div>
          `).join("")}
        </div>

        <button class="btn-teal" style="font-size: 1.05rem; padding: 14px 28px;" onclick="saveClassLists()">Save All Class Lists</button>
      </div>

      <div class="admin-card">
        <h3>4. Bulk Import Rosters (Excel / CSV)</h3>
        <input type="file" id="fileUpload" accept=".xlsx, .xls, .csv" onchange="importExcelFile(event)">
      </div>

      <div class="admin-card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h3 style="margin: 0;">5. Local Pass Log (${store.logs.length} entries)</h3>
          <div>
            <button class="btn-teal" style="background: var(--success); color: #000;" onclick="exportCSV()">Export CSV</button>
            <button class="btn-nav" style="color: var(--danger); border-color: #7f1d1d;" onclick="clearLogs()">Clear</button>
          </div>
        </div>

        <div class="log-table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date / Time</th>
                <th>Period</th>
                <th>Student</th>
                <th>Reason</th>
                <th>Duration</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${store.logs.length === 0 ? `<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">No entries recorded yet.</td></tr>` : 
                store.logs.slice().reverse().map(l => `
                  <tr>
                    <td>${l.timestamp}</td>
                    <td>P${l.period} (${l.course})</td>
                    <td><strong>${l.studentName}</strong></td>
                    <td>${l.reason}</td>
                    <td>${l.duration}</td>
                    <td><span style="color: ${l.status === 'On Time' ? '#4ade80' : l.status === 'Overdue' ? '#f87171' : l.status === 'FLAGGED' ? '#ef4444' : '#fde047'}; font-weight: 700;">${l.status}</span></td>
                  </tr>
                `).join("")}
            </tbody>
          </table>
        </div>
      </div>

      <div class="admin-card">
        <h3>6. Change Security PIN</h3>
        <input type="password" id="newPin" class="search-input" style="max-width: 200px; font-size: 18px;" placeholder="New PIN">
        <button class="btn-teal" onclick="updatePin()">Save PIN</button>
      </div>
    `;
  }

  function saveMaxPasses() {
    const val = parseInt(document.getElementById("maxPassesInput").value, 10);
    if (!isNaN(val) && val >= 1) {
      store.maxConcurrent = val;
      saveStore();
      alert(`Classroom limit set to ${val} concurrent passes!`);
    } else {
      alert("Please enter a valid number (at least 1).");
    }
  }

  function navigate(view) {
    currentDraft.view = view;
    render();
  }

  function saveWebhook() {
    store.webhookUrl = document.getElementById("webhookInput").value.trim();
    saveStore();
    alert("Google Sheets Webhook URL saved!");
  }

  function testWebhookConnection() {
    const url = document.getElementById("webhookInput").value.trim();
    const statusDiv = document.getElementById("testPingStatus");

    if (!url) {
      statusDiv.style.color = "var(--danger)";
      statusDiv.innerText = "⚠️ Please paste your Google Sheets Webhook URL first.";
      return;
    }

    statusDiv.style.color = "var(--warning)";
    statusDiv.innerText = "⏳ Sending test ping to Google Sheet...";

    fetch(url, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "TEST_PING" })
    })
    .then(() => {
      statusDiv.style.color = "var(--success)";
      statusDiv.innerText = "✓ Test ping sent! Check your Google Sheet to verify the new test row.";
      store.webhookUrl = url;
      saveStore();
    })
    .catch((err) => {
      statusDiv.style.color = "var(--danger)";
      statusDiv.innerText = "✗ Could not reach webhook. Please verify your deployment settings.";
      console.error(err);
    });
  }

  function addNewPeriod() {
    const pKey = document.getElementById("newPeriodKey").value.trim();
    const course = document.getElementById("newPeriodCourse").value.trim() || `Period ${pKey}`;

    if (!pKey) return alert("Please enter a period number or label.");
    if (store.rosters[pKey]) return alert(`Period "${pKey}" already exists.`);

    syncFormInputsToStore();
    store.rosters[pKey] = { course: course, students: [] };
    saveStore();
    renderTeacherPortal();
  }

  function deletePeriod(pKey) {
    if (confirm(`Remove Period ${pKey} and its roster?`)) {
      syncFormInputsToStore();
      delete store.rosters[pKey];
      saveStore();
      renderTeacherPortal();
    }
  }

  function syncFormInputsToStore() {
    const pKeys = Object.keys(store.rosters);
    pKeys.forEach(p => {
      const cEl = document.getElementById(`c_name_${p}`);
      const rEl = document.getElementById(`roster_txt_${p}`);
      if (cEl && rEl) {
        const course = cEl.value.trim();
        const txt = rEl.value.trim();
        const list = txt ? txt.split("\n").map(s => s.trim()).filter(Boolean) : [];
        store.rosters[p] = { course: course, students: list };
      }
    });
  }

  function saveClassLists() {
    syncFormInputsToStore();
    saveStore();
    alert("All class periods and rosters saved successfully!");
  }

  function importExcelFile(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });

      rows.forEach((r, i) => {
        if (i === 0 && isNaN(parseInt(r[0]))) return;
        const p = String(r[0]).trim();
        const s = r[1] ? String(r[1]).trim() : "";
        const c = r[2] ? String(r[2]).trim() : "";

        if (p && s) {
          if (!store.rosters[p]) {
            store.rosters[p] = { course: c || `Period ${p}`, students: [] };
          } else if (c) {
            store.rosters[p].course = c;
          }
          if (!store.rosters[p].students.includes(s)) {
            store.rosters[p].students.push(s);
          }
        }
      });

      saveStore();
      alert("Excel file imported successfully!");
      renderTeacherPortal();
    };
    reader.readAsArrayBuffer(file);
  }

  function exportCSV() {
    if (store.logs.length === 0) return alert("No logs to export.");
    let csv = "Date/Time,Period,Course,Student Name,Reason,Duration,Status\n";
    store.logs.forEach(l => {
      csv += `"${l.timestamp}","${l.period}","${l.course}","${l.studentName}","${l.reason}","${l.duration}","${l.status}"\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `Hall_Pass_Log_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function clearLogs() {
    if (confirm("Delete all logged records?")) {
      store.logs = [];
      saveStore();
      renderTeacherPortal();
    }
  }

  function updatePin() {
    const val = document.getElementById("newPin").value.trim();
    if (val && val.length >= 4) {
      store.pin = val;
      saveStore();
      alert("PIN updated successfully.");
      document.getElementById("newPin").value = "";
    } else {
      alert("PIN must be at least 4 digits.");
    }
  }

  startEngine();
  render();
</script>
</body>
</html>
